<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban MVP - Base Setup</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #032147;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #0a2d59;
      border: 1px solid #209dd7;
      border-radius: 8px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin-top: 0;
      color: #ecad0a;
      font-size: 24px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.5;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      background: #753991;
      color: white;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .endpoint-box {
      background: #041a38;
      border: 1px solid #1e4976;
      border-radius: 4px;
      padding: 12px;
      margin-top: 16px;
      font-family: monospace;
      color: #209dd7;
    }
    button {
      background: #209dd7;
      color: #032147;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    #api-result {
      margin-top: 12px;
      font-family: monospace;
      font-size: 13px;
      color: #888888;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">Step 2 - Base Scaffolding</div>
    <h1>Kanban MVP Backend</h1>
    <p>FastAPI static mount is working properly. This HTML file is served directly from the root path (/).</p>
    <div class="endpoint-box">API Check: /api/health</div>
    <button onclick="checkAPI()">Test API Endpoint</button>
    <div id="api-result">Click above to verify API communication.</div>
  </div>

  <script>
    async function checkAPI() {
      const resElem = document.getElementById('api-result');
      resElem.innerText = 'Calling /api/health...';
      try {
        const resp = await fetch('/api/health');
        const data = await resp.json();
        resElem.style.color = '#ecad0a';
        resElem.innerText = 'API Response: ' + JSON.stringify(data);
      } catch (err) {
        resElem.style.color = '#ff4444';
        resElem.innerText = 'API Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
